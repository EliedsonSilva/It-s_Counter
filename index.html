<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>It's Counter</title>
</head>
<body>
    <div class="counter">
        <section class="count-display">
            <span id="counterDisplay">00:00:00</span>
        </section>
    </div>
    <div class="buttons">
        <button id="play">▶️</button>
        <button id="pause">⏸</button>
        <button id="stop">🛑</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
